<!doctype html><html><head><title>Create Invoice</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="header"><b>CentrAlign AP</b><a href="/invoices">Invoices</a></div><main><h1>Create Invoice</h1><form method="post" action="/invoices/submit"><label>Vendor</label><input id="vendor" name="vendor"><label>Invoice Number</label><input id="invoice_number" name="invoice_number"><label>Invoice Date</label><input id="invoice_date" name="invoice_date"><label>Due Date</label><input id="due_date" name="due_date"><label>Subtotal</label><input id="subtotal" name="subtotal"><label>Tax</label><input id="tax" name="tax"><label>Total Amount</label><input id="total_amount" name="total_amount"><label>Payment Terms</label><input id="payment_terms" name="payment_terms"><label>Task ID (worker only)</label><input id="task_id" name="task_id"><button id="submit-btn" type="submit">Submit</button></form><div id="submit-error" style="display: none">{{error}}</div><div id="created-id">{{created_id}}</div></main></body></html>
