<!doctype html><html><head><title>Invoice {{invoice_id}}</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>Invoice {{invoice_id}}</h1><dl><dt>Vendor</dt><dd id="actual-vendor">{{vendor}}</dd><dt>Invoice Number</dt><dd id="actual-invoice-number">{{invoice_number}}</dd><dt>Invoice Date</dt><dd id="actual-invoice-date">{{invoice_date}}</dd><dt>Due Date</dt><dd id="actual-due-date">{{due_date}}</dd><dt>Total</dt><dd id="actual-total">{{total}}</dd><dt>Status</dt><dd id="actual-status">{{status}}</dd></dl></main></body></html>
